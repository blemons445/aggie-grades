<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Texas A&amp;M grade distributions by course and professor, sortable, with a GPA chart.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="AGF">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Aggie Grade Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: matches Past the Post. White sticky nav, big Outfit headline, soft rounded cards on white, tinted panels, pill controls. */
:root {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #faf6f6; --tint: #faf6f6; --line: #e6dada; --line-strong: #d6c8c8;
  --fg: #1a1414; --fg-2: #3d3434; --fg-3: #7a6c6c;
  --accent: #500000; --accent-soft: #f6eded; --link: #6b0f1a; --cta: #500000; --on-cta: #ffffff; --num: #500000;
  --chip-bg: #f6eded; --chip-fg: #500000; --nav: rgb(255 255 255 / 92%); --focus: #2a78d6;
  --shadow: 0 1px 2px rgb(80 0 0 / 5%), 0 8px 24px rgb(80 0 0 / 7%);
  --g-a: #4a0d12; --g-b: #8c2f39; --g-c: #c97b84; --g-d: #e8b8bd; --g-f: #9a9597;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --good: #1f7a45; --bad: #b42318;
  --f-display: "Outfit", system-ui, sans-serif;
  --f-body: "Work Sans", system-ui, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e0e10; --surface: #17171a; --surface-2: #131315; --tint: #131315; --line: #2c2c32; --line-strong: #3f3f46;
  --fg: #f4f4f5; --fg-2: #c8c8d0; --fg-3: #8e8e98;
  --accent: #d8a7ad; --accent-soft: #241a1c; --link: #e2b8bd; --cta: #8c1d2c; --on-cta: #ffffff; --num: #f4f4f5;
  --chip-bg: #1f1f23; --chip-fg: #e4e4e7; --nav: rgb(14 14 16 / 92%); --focus: #6da7ec;
  --shadow: 0 1px 0 rgb(255 255 255 / 3%) inset, 0 8px 24px rgb(0 0 0 / 35%);
  --g-a: #f0c9cc; --g-b: #d68b94; --g-c: #a8505c; --g-d: #6e2a33; --g-f: #6d6668;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good: #4ade80; --bad: #f87171;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0e0e10; --surface: #17171a; --surface-2: #131315; --tint: #131315; --line: #2c2c32; --line-strong: #3f3f46;
  --fg: #f4f4f5; --fg-2: #c8c8d0; --fg-3: #8e8e98;
  --accent: #d8a7ad; --accent-soft: #241a1c; --link: #e2b8bd; --cta: #8c1d2c; --on-cta: #ffffff; --num: #f4f4f5;
  --chip-bg: #1f1f23; --chip-fg: #e4e4e7; --nav: rgb(14 14 16 / 92%); --focus: #6da7ec;
  --shadow: 0 1px 0 rgb(255 255 255 / 3%) inset, 0 8px 24px rgb(0 0 0 / 35%);
  --g-a: #f0c9cc; --g-b: #d68b94; --g-c: #a8505c; --g-d: #6e2a33; --g-f: #6d6668;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good: #4ade80; --bad: #f87171;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* nav */
body::before { background: var(--nav); }
.band { background: var(--nav); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.band .wrap { padding-block: 10px; display: flex; gap: 10px 20px; align-items: center; flex-wrap: wrap; }
.brand { text-decoration: none; display: inline-flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 19px; white-space: nowrap; color: var(--fg); }
.logo { min-width: 28px; padding: 0 6px; height: 28px; border-radius: 7px; background: var(--cta); color: var(--on-cta); display: grid; place-items: center; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
.search { position: relative; flex: 1 1 200px; min-width: 0; }
.search input { width: 100%; padding: 9px 14px 9px 38px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); font-size: 16px; }
.search input::placeholder { color: var(--fg-3); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--fg-3); }
.themebtn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--fg); flex: none; }
.suggest { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; z-index: 20; }
.suggest button { display: flex; width: 100%; text-align: left; gap: 10px; align-items: baseline; padding: 10px 14px; border: 0; background: none; cursor: pointer; }
.suggest button[aria-selected="true"], .suggest button:hover { background: var(--accent-soft); }
.suggest .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-3); width: 72px; flex: none; }
.suggest .sub { color: var(--fg-3); font-size: 13px; margin-left: auto; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 14px 4px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.chip[aria-current="true"] { background: var(--cta); color: var(--on-cta); border-color: var(--cta); }
.chips .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-3); align-self: center; margin-right: 4px; }

main { padding-block: 10px 56px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
main > * { min-width: 0; }
.head { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: flex-end; justify-content: space-between; padding-top: 10px; }
.head h1 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 700; font-size: clamp(34px, 6vw, 56px); line-height: 1.02; letter-spacing: -.02em; color: var(--fg); text-wrap: balance; }
.head .meta { color: var(--fg-2); font-size: 15px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; background: var(--surface); padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 12px; cursor: pointer; font-size: 14px; font-weight: 500; border-radius: 999px; color: var(--fg-2); }
.seg button[aria-pressed="true"] { background: var(--cta); color: var(--on-cta); }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--fg-2); cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; background: var(--tint); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.stat { padding: 4px 10px; display: grid; gap: 2px; justify-items: center; text-align: center; }
.stat .k { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-3); }
.stat .v { font-family: var(--f-display); font-weight: 700; font-size: 38px; line-height: 1.1; color: var(--num); font-variant-numeric: tabular-nums; }
.stat .s { font-size: 13px; color: var(--fg-3); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 20px; min-width: 0; }
.panel h2 { margin: 0 0 4px; font-family: var(--f-display); font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.panel .hint { margin: 0 0 12px; color: var(--fg-2); font-size: 14px; }
.chartbox { position: relative; height: 340px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

.tablebar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.tablebar input { padding: 7px 12px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface-2); min-width: 0; width: 220px; max-width: 100%; }
.tscroll { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child, .l { text-align: left; }
thead th { position: sticky; top: 0; background: var(--surface); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); font-weight: 600; user-select: none; }
thead th.sortable { cursor: pointer; }
thead th.sortable:hover { color: var(--fg); }
thead th[aria-sort] { color: var(--link); }
thead th[aria-sort="ascending"]::after { content: " ↑"; }
thead th[aria-sort="descending"]::after { content: " ↓"; }
.sortnote { font-size: 13px; color: var(--fg-3); margin: 8px 0 0; }
tbody tr:hover { background: var(--surface-2); }
td.num { font-size: 13px; }
.pname { display: inline-flex; align-items: center; gap: 8px; }
.pname input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
.sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
a.link, button.link { color: var(--link); text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; }
a.link:hover, button.link:hover { text-decoration: underline; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--chip-bg); color: var(--chip-fg); margin-left: 6px; font-weight: 600; letter-spacing: .04em; }
.gpa { font-weight: 600; }
.dist { display: flex; width: 160px; height: 12px; gap: 2px; }
.dist span { height: 100%; }
.dist span:first-child { border-radius: 3px 0 0 3px; }
.dist span:last-child { border-radius: 0 3px 3px 0; }
.glegend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--fg-2); }
.glegend span { display: inline-flex; gap: 5px; align-items: center; }
.glegend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.policy { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.pcard { border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 6px; align-content: start; min-width: 0; }
.pcard .k { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 700; }
.pcard p { margin: 0; color: var(--fg-2); font-size: 14px; }
.pcard .src { font-size: 12px; color: var(--fg-3); }
.pcard a { color: var(--link); font-weight: 600; }
.pcard.missing p { color: var(--fg-3); }
.pcard p, .pcard li { color: var(--fg-2); font-size: 14px; }
.pcard ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
.pcard .muted { color: var(--fg-3); }
.pcard textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px; background: var(--surface-2); color: var(--fg); font: inherit; font-size: 16px; resize: vertical; }
.pcard .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.btn { justify-self: start; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
.btn.primary { background: var(--cta); border-color: var(--cta); color: var(--on-cta); }
.more { margin-top: 10px; }
.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.ccard { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; align-content: start; background: var(--surface-2); min-width: 0; }
.cname { display: flex; align-items: center; gap: 8px; font-size: 15px; min-width: 0; }
.cname .link { text-align: left; }
.cgpa { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1; color: var(--num); }
.cgpa small { font-family: var(--f-body); font-size: 13px; font-weight: 500; color: var(--fg-3); margin-left: 6px; }
.ccard dl { margin: 0; display: grid; gap: 4px; }
.ccard dl div { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.ccard dt { color: var(--fg-3); }
.ccard dd { margin: 0; font-weight: 600; }
.ccard .trend { margin: 0; font-size: 13px; color: var(--fg-2); border-top: 1px solid var(--line); padding-top: 8px; }
.tag.good { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); justify-self: start; margin: 0; }
.tag.ghost { visibility: hidden; justify-self: start; margin: 0; }
@media (max-width: 560px) { .compare { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 47%; overflow-x: auto; scroll-snap-type: x mandatory; gap: 8px; padding-bottom: 4px; } .ccard { padding: 12px; scroll-snap-align: start; } .cgpa { font-size: 28px; } }
.hero { padding-block: 24px 8px; display: grid; gap: 12px; max-width: 680px; }
#heroviz { width: 100%; max-width: 100%; height: 110px; display: block; margin-bottom: 6px; }
@media (min-width: 900px) { .hero { max-width: none; grid-template-columns: minmax(0, 1fr) minmax(0, .9fr); column-gap: 48px; align-items: end; } .hero > :not(#heroviz) { grid-column: 1; } #heroviz { grid-column: 2; grid-row: 1 / span 3; height: 100%; min-height: 220px; margin: 0; } }
.hero h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(32px, 7vw, 52px); line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; }
.hero p { margin: 0; color: var(--fg-2); font-size: 17px; max-width: 52ch; }
.search.big input { padding: 14px 16px 14px 44px; font-size: 17px; border-width: 1.5px; box-shadow: var(--shadow); }
.search.big svg { left: 16px; }
.homeblock h2 { margin: 0 0 10px; font-family: var(--f-display); font-size: 18px; font-weight: 600; }
.chiprow { display: flex; flex-wrap: wrap; gap: 8px; }
.chiprow .chip { font-size: 14px; padding: 7px 14px; }
.sm-only { display: none; }
.semrow { display: flex; gap: 8px; overflow-x: auto; padding-block: 2px 6px; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
.sem { flex: none; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg-2); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.sem:hover { border-color: var(--cta); color: var(--fg); }
.sem[aria-pressed="true"] { background: var(--cta); color: var(--on-cta); border-color: var(--cta); }
details.panel > summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary h2 { margin: 0; }
details.panel > summary::after { content: "Show"; font-size: 14px; color: var(--link); font-weight: 600; }
details.panel[open] > summary::after { content: "Hide"; }
.stats { max-width: 640px; }
.empty { padding: 28px; text-align: center; color: var(--fg-2); }
.foot { color: var(--fg-3); font-size: 13px; max-width: 70ch; }
.foot b { color: var(--fg-2); }
@media (max-width: 640px) { .chartbox { height: 260px; } .stat .v { font-size: 30px; } .brand .bname { display: none; } }
@media (max-width: 560px) {
  .sm-hide { display: none; }
  .sm-only { display: inline; }
  .lg-only { display: none; }
  thead th { white-space: normal; letter-spacing: .02em; font-size: 11px; vertical-align: bottom; }
  .pname .link { white-space: normal; text-align: left; }
  th, td { padding: 9px 6px; }
  .pname { gap: 10px; }
  .pname input { width: 20px; height: 20px; }
  .panel { padding: 16px 14px; }
  .tscroll { margin: 0 -14px; padding: 0 14px; }
  .stats { padding: 14px 6px; gap: 4px; }
  .stat { padding: 2px; }
  .stat .v { font-size: 28px; }
  .stat .k { font-size: 11px; letter-spacing: .05em; }
  .head { gap: 12px; }
  .seg button { padding: 7px 14px; }
  .tablebar input { width: 100%; font-size: 16px; }
  .policy { grid-template-columns: 1fr; }
  .legend { font-size: 12px; gap: 6px 10px; }
  button.link { padding-block: 4px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>


<header class="band">
  <div class="wrap">
    <a class="brand" href="#" aria-label="Aggie Grade Finder home"><span class="logo" aria-hidden="true">AGF</span><span class="bname">Aggie Grade Finder</span></a>
    <div class="search" role="combobox" aria-expanded="false" aria-haspopup="listbox">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.2" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="Course or professor" aria-label="Search courses and professors">
      <div class="suggest" id="suggest" role="listbox" hidden></div>
    </div>
    <button class="themebtn" id="themebtn" type="button" aria-label="Switch light or dark mode"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
</header>

<div class="wrap">
  <main id="app"></main>
  <p class="foot" id="foot"></p>

const R = { sec:0, A:1, B:2, C:3, D:4, F:5, I:6, S:7, U:8, Q:9, X:10, P:11, T:12 };
const isHonors = r => r[R.sec][0] === "2";
let COURSES = Object.keys(D.courses).sort();
const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const pct = (n,d) => d ? n/d*100 : 0;
const fmtPct = v => Math.round(v) + "%";
const fmtGpa = v => (v==null||isNaN(v)) ? "–" : v.toFixed(2);
const nice = p => p.split(" ").map((w,i,a) => (i === a.length-1 && w.length <= 2) ? w : w.toLowerCase().replace(/(^|[-'])(\w)/g,(m,x,y)=>x+y.toUpperCase())).join(" ");
const profSlug = p => "prof-" + p.replace(/[^A-Za-z0-9]+/g,"-");
const courseSlug = c => c.replace(" ","-");

// Professor index across loaded courses
const profCourses = new Map();
for (const c of COURSES) for (const r of D.courses[c]) {
  const p = PROFS[r[R.P]];
  if (!profCourses.has(p)) profCourses.set(p, new Set());
  profCourses.get(p).add(c);
}
let LATEST = Math.max(...COURSES.flatMap(c => D.courses[c].map(r => r[R.T])));

// Live lookup (works when hosted with the /api/grades function, e.g. on Vercel)
const COURSE_RE = /^[A-Z]{4} \d{3}$/;
const SEMC = {SPRING:1, SUMMER:2, FALL:3};
const pending = new Map();
function addCourse(key, classes) {
  const pidx = new Map(PROFS.map((p,i) => [p,i]));
  const rows = classes.map(c => {
    const p = String(c.prof||"").trim();
    if (!pidx.has(p)) { pidx.set(p, PROFS.length); PROFS.push(p); }
    return [String(c.section), ...["A","B","C","D","F","I","S","U","Q","X"].map(k => parseInt(c[k],10)||0), pidx.get(p), parseInt(c.year,10)*10 + (SEMC[c.semester]||0)];
  });
  D.courses[key] = rows;
  COURSES = Object.keys(D.courses).sort();
  for (const r of rows) { const p = PROFS[r[R.P]]; if (!profCourses.has(p)) profCourses.set(p, new Set()); profCourses.get(p).add(key); if (r[R.T] > LATEST) LATEST = r[R.T]; }
}
function fetchCourse(key) {
  if (pending.has(key)) return pending.get(key);
  const [dept, number] = key.split(" ");
  const pr = fetch(`/api/grades?dept=${dept}&number=${number}`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(j => { if (!j.classes || !j.classes.length) throw new Error("empty"); addCourse(key, j.classes); return key; })
    .finally(() => pending.delete(key));

  return pr;
}
function showLoading(key) { document.getElementById("app").innerHTML = `<div class="head"><div><h1>${esc(key)}</h1><div class="meta">Loading grade history…</div></div></div>`; }
function showMissing(key) { document.getElementById("app").innerHTML = `<div class="head"><div><h1>${esc(key)}</h1><div class="meta">Couldn't load grades for ${esc(key)}. Check the course number, or try again in a minute.</div></div></div>`; }
// Full course index (every course with grades in the last four terms), built from the registrar's grade reports.
let IDX = null;
const idxReady = fetch("courses.json").then(r => r.ok ? r.json() : null).then(j => { IDX = j; if (document.activeElement === qi) showSuggest(); return j; }).catch(() => null);
const triedProf = new Set();
let idxDone = false; idxReady.then(() => { idxDone = true; });
function remember(type, key) { const r = store.get("agf-recent", []).filter(x => !(x.type === type && x.key === key)); r.unshift({type, key}); store.set("agf-recent", r.slice(0, 6)); }
function renderHome() {

  const recent = store.get("agf-recent", []);

// Home animation: a living grade histogram. Five bands (A to F) of thin bars that swell and settle like a crowd of semesters.
let vizRaf = 0;
function startHeroViz() {
  cancelAnimationFrame(vizRaf);
  const cv = document.getElementById("heroviz"); if (!cv) return;
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const bands = ["--g-a","--g-b","--g-c","--g-d","--g-f"];
  const weights = [1, 0.72, 0.42, 0.2, 0.12];
  const N = 60, seeds = Array.from({length: N}, (_, i) => [Math.sin(i * 12.9898) * 43758.5453 % 1, Math.cos(i * 78.233) * 12345.678 % 1]);
  let cols = bands.map(css), t0 = performance.now();
  const frame = now => {
    if (!cv.isConnected) return;
    const w = cv.clientWidth, h = cv.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cols = bands.map(css); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    const t = reduce ? 4 : (now - t0) / 1000, gap = 3, bw = (w - gap * (N - 1)) / N;
    for (let i = 0; i < N; i++) {
      const band = Math.min(4, Math.floor(i / (N / 5))), x = i * (bw + gap);
      const [a, b] = seeds[i];
      const wave = 0.55 + 0.25 * Math.sin(t * 0.9 + i * 0.22 + a * 6) + 0.2 * Math.sin(t * 0.37 - i * 0.11 + b * 9);
      const bh = Math.max(4, h * weights[band] * wave);
      ctx.fillStyle = cols[band];
      ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, h - bh, bw, bh, [Math.min(4, bw / 2), Math.min(4, bw / 2), 0, 0]) : ctx.rect(x, h - bh, bw, bh); ctx.fill();
    }

    if (!reduce) vizRaf = requestAnimationFrame(frame);
  };
  vizRaf = requestAnimationFrame(frame);
}
function renderDept(code) {
  const name = (IDX && IDX.depts[code]) || code;
  const list = IDX ? Object.entries(IDX.courses).filter(([c]) => c.startsWith(code + " ")) : [];
  document.getElementById("app").innerHTML = `
    <div class="head"><div><h1>${esc(code)}</h1><div class="meta">${esc(name)} · ${list.length} courses</div></div></div>
    <section class="panel"><div class="tscroll"><table>
      <thead><tr><th class="l">Course</th><th>Students, past year</th><th>Last offered</th></tr></thead>
      <tbody>${list.map(([c,[n,t]]) => `<tr><td class="l"><button class="link" data-course="${c}">${c}</button></td><td class="num">${n.toLocaleString()}</td><td class="num">${semShort(t)}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">No courses found for ${esc(code)}.</td></tr>`}</tbody>
    </table></div><p class="sortnote">Students who got a letter grade in Fall 2025, Spring 2026 and Summer 2026. Tap a course to see every semester and professor.</p></section>`;
  if (chart) { chart.destroy(); chart = null; }
}

function agg(rows) {
  const a = {A:0,B:0,C:0,D:0,F:0,Q:0,I:0,S:0,U:0,X:0, sections: rows.length, first: Infinity, last: 0};
  for (const r of rows) {
    a.A+=r[R.A]; a.B+=r[R.B]; a.C+=r[R.C]; a.D+=r[R.D]; a.F+=r[R.F]; a.Q+=r[R.Q];
    a.I+=r[R.I]; a.S+=r[R.S]; a.U+=r[R.U]; a.X+=r[R.X];
    if (r[R.T] < a.first) a.first = r[R.T]; if (r[R.T] > a.last) a.last = r[R.T];
  }
  a.graded = a.A+a.B+a.C+a.D+a.F;
  a.gpa = a.graded ? (4*a.A+3*a.B+2*a.C+a.D)/a.graded : null;
  a.pA = pct(a.A,a.graded); a.pB = pct(a.B,a.graded); a.pC = pct(a.C,a.graded); a.pDF = pct(a.D+a.F,a.graded);
  a.pQ = pct(a.Q, a.graded + a.Q);
  return a;
}

function distBar(a) {
  if (!a.graded) return "";
  const parts = [["A","--g-a"],["B","--g-b"],["C","--g-c"],["D","--g-d"],["F","--g-f"]];
  const tip = parts.map(([k]) => `${k} ${fmtPct(pct(a[k],a.graded))}`).join(" · ") + (a.Q ? ` · Q-drops ${a.Q}` : "");
  return `<div class="dist" title="${tip}" aria-label="${tip}">` + parts.filter(([k]) => a[k] > 0).map(([k,v]) => `<span style="flex:${a[k]};background:var(${v})"></span>`).join("") + `</div>`;
}
const gradeLegend = `<div class="glegend" aria-hidden="true">${[["A","--g-a"],["B","--g-b"],["C","--g-c"],["D","--g-d"],["F","--g-f"]].map(([k,v])=>`<span><i style="background:var(${v})"></i>${k}</span>`).join("")}</div>`;

// ---------- state ----------
const st = {
  view: null,           // {type:'course', key} | {type:'prof', key}
  range: "all",         // all | 5 | 2
  honors: true,
  summer: true,
  chartProfs: new Set(),
  profSort: { key: "last", dir: -1 },
  secSort: { key: "T", dir: -1 },
  secFilter: "",
  secLimit: 40,

function savePrefs(){}

function inRange(r) {
  if (!st.summer && r[R.T]%10 === 2) return false;
  if (!st.honors && isHonors(r)) return false;
  if (st.range === "all") return true;
  return r[R.T] === +st.range;
}

// ---------- chips ----------
function renderChips() {
  const cur = st.view && st.view.type === "course" ? st.view.key : null;
  document.getElementById("chips").innerHTML = `<span class="lbl">Loaded</span>` + COURSES.map(c => `<button class="chip" data-course="${c}" aria-current="${c===cur}">${c}</button>`).join("");

// ---------- routing ----------
function go(type, key) {
  const h = type === "course" ? courseSlug(key) : profSlug(key);
  if (location.hash.slice(1) !== h) location.hash = h; else route();
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  let v = null;
  if (h.startsWith("dept-")) {
    const code = h.slice(5).toUpperCase();
    if (!IDX) { idxReady.then(() => { if (IDX) route(); }); }
    st.view = {type:"dept", key:code}; renderDept(code); window.scrollTo({top:0}); return;
  } else if (h.startsWith("prof-")) {
    const want = h.slice(5).replace(/-/g," ").toUpperCase().trim();
    const norm = p => p.replace(/[^A-Za-z0-9]+/g," ").trim();
    let p = [...profCourses.keys()].find(p => norm(p) === want) || (IDX && Object.keys(IDX.profs).find(p => norm(p) === want));
    if (!IDX && !idxDone) { showLoading(nice(want)); idxReady.then(() => { idxDone = true; route(); }); return; }
    if (p && IDX && IDX.profs[p] && !triedProf.has(p)) {
      const missing = IDX.profs[p].filter(c => !D.courses[c]);
      if (missing.length) { triedProf.add(p); showLoading(nice(p)); Promise.allSettled(missing.map(fetchCourse)).then(route); return; }
    }
    if (p && profCourses.has(p)) v = {type:"prof", key:p};
  } else if (h) {
    const c = h.replace("-"," ").toUpperCase();
    if (D.courses[c]) v = {type:"course", key:c};
    else if (COURSE_RE.test(c)) { showLoading(c); fetchCourse(c).then(route, () => { showMissing(c); }); return; }
  }
  if (!v) { st.view = {type:"home"}; renderHome(); if (!IDX && !idxDone) idxReady.then(() => { if (st.view.type === "home") renderHome(); }); return; }
  const changed = !st.view || st.view.type !== v.type || st.view.key !== v.key;
  st.view = v;
  if (changed) { st.chartProfs = null; st.secFilter = ""; st.secLimit = 40; }
  render();
  if (changed) window.scrollTo({top:0});
}
window.addEventListener("hashchange", route);

// ---------- render ----------
let chart = null;
function render() {
  if (st.view.type === "home") renderHome(); else if (st.view.type === "course") renderCourse(st.view.key); else if (st.view.type === "dept") renderDept(st.view.key); else renderProf(st.view.key);
  document.getElementById("foot").innerHTML = `<b>About the data.</b> Section-level grade counts from Texas A&amp;M's public grade distribution reports (Spring 2015 to ${semLabel(LATEST)}), via anex.us. GPA counts A through F only; Q-drops, I, S and U are left out of GPA, as the registrar does. Professors are listed the way the reports list them: last name and first initial. Honors sections are numbered 200–299.`;

function semsOf(rows) { return [...new Set(rows.map(r => r[R.T]))].sort((a,b) => b-a); }
function fixRange(sems) { if (st.range !== "all" && !sems.includes(+st.range)) st.range = "all"; }
function filtersHtml(sems) {
  const pill = (k, l) => `<button class="sem" data-range="${k}" aria-pressed="${String(st.range)===String(k)}">${l}</button>`;

}
function bindFilters(root) {
  root.querySelectorAll("[data-range]").forEach(b => b.onclick = () => { st.range = b.dataset.range; savePrefs(); render(); });
}

function statsHtml(a, extra) {
  return `<section class="stats" aria-label="Summary">
    <div class="stat"><span class="k">Average GPA</span><span class="v num">${fmtGpa(a.gpa)}</span></div>
    <div class="stat"><span class="k">Got an A</span><span class="v num">${fmtPct(a.pA)}</span></div>
    <div class="stat"><span class="k">Students</span><span class="v num">${a.graded.toLocaleString()}</span></div>
    ${extra}
  </section>`;
}

function renderCourse(key) {
  const all = D.courses[key];
  fixRange(semsOf(all));
  const rows = all.filter(inRange);
  const a = agg(rows);
  // per professor
  const byProf = new Map();
  for (const r of rows) { const p = PROFS[r[R.P]]; if (!byProf.has(p)) byProf.set(p, []); byProf.get(p).push(r); }
  const profList = [...byProf].map(([p, rs]) => ({ p, ...agg(rs) }));
  // default chart selection: most students in the last 3 years, up to 5
  if (!st.chartProfs) {
    const recent = profList.map(x => ({ p: x.p, n: byProf.get(x.p).filter(r => r[R.T] > LATEST-30).reduce((s,r)=>s+r[R.A]+r[R.B]+r[R.C]+r[R.D]+r[R.F],0) }))
      .sort((x,y) => y.n - x.n).filter(x => x.n > 0).slice(0,3);
    st.chartProfs = new Set((recent.length ? recent : profList.slice(0,5)).map(x => x.p));
  }
  // stable colors: by order of first selection; keep up to 8

  const sem0 = a.first === Infinity ? null : a.first;
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="head">
      <div><h1>${esc(key)}</h1><div class="meta">${st.range === "all" ? (sem0 ? semLabel(sem0) + " to " + semLabel(a.last) : "") : "Showing " + semLabel(+st.range) + " only"}</div></div>
    </div>

    ${statsHtml(a, "")}
    ${compareHtml(profList, all, colorOf)}
    <section class="panel">
      <h2>GPA by semester</h2>
      <div class="chartbox"><canvas id="chart" role="img" aria-label="Line chart of average GPA by semester for selected professors"></canvas></div>
      <div class="legend" id="legend"></div>
    </section>
    <section class="panel">
      <div class="tablebar"><h2>Professors</h2><span class="hint" style="margin:0">Tick to compare and chart</span></div>
      <div class="tscroll"><table id="ptable">${profTable(profList, colorOf)}</table></div>
      <p class="sortnote" id="psort"></p>
    </section>
    <details class="panel">
      <summary><h2>Every section</h2></summary>

      <div class="tscroll"><table id="stable"></table></div>

  sortNote();
  renderSections(rows);
  app.querySelector("#secq").oninput = e => { st.secFilter = e.target.value; st.secLimit = 40; renderSections(rows); };
  drawChart(all.filter(r => (st.honors || !isHonors(r))), colorOf);
}

function trendOf(rows) {
  const recent = agg(rows.filter(r => r[R.T] > LATEST - 20)), older = agg(rows.filter(r => r[R.T] <= LATEST - 20));
  if (recent.gpa == null) return "Hasn't taught it in 2 years";
  if (older.gpa == null) return "New in the last 2 years";
  const d = recent.gpa - older.gpa;
  return d > 0.1 ? "Grading easier lately" : d < -0.1 ? "Grading harder lately" : "Steady over time";
}
function compareHtml(list, allRows, colorOf) {
  const picks = list.filter(x => st.chartProfs.has(x.p)).sort((a,b) => (b.gpa||0) - (a.gpa||0));

    <div class="cname"><span class="sw" style="background:var(${colorOf.get(x.p) || "--fg-3"})"></span><button class="link" data-prof="${esc(x.p)}">${esc(nice(x.p))}</button></div>

function bestProf(list) {

  return c ? `<button class="link" data-prof="${esc(c.p)}">${esc(nice(c.p))}</button>` : "–";

let colorAssign = new Map();
function colorMap() {
  // color follows the professor, not their rank; free slots get reused only when a prof is unticked
  for (const p of [...colorAssign.keys()]) if (!st.chartProfs.has(p)) colorAssign.delete(p);
  const used = new Set(colorAssign.values());
  for (const p of st.chartProfs) if (!colorAssign.has(p)) { const s = SERIES.find(s => !used.has(s)); if (s) { colorAssign.set(p, s); used.add(s); } }
  return colorAssign;
}

const PCOLS = [

function profTable(list, colorOf) {
  const {key, dir} = st.profSort;
  list.sort((x,y) => { let a = x[key], b = y[key]; if (key === "p") return dir * a.localeCompare(b); if (a==null) a = -1; if (b==null) b = -1; return dir * (a - b) || x.p.localeCompare(y.p); });

  const body = list.map(x => {
    const on = st.chartProfs.has(x.p);
    const col = colorOf.get(x.p);
    return `<tr>
      <td class="l"><span class="pname"><input type="checkbox" data-pick="${esc(x.p)}" ${on?"checked":""} aria-label="Show ${esc(nice(x.p))} on chart"><span class="sw" style="background:${on&&col?`var(${col})`:"transparent"}"></span><button class="link" data-prof="${esc(x.p)}">${esc(nice(x.p))}</button></span></td>
      <td class="num">${semShort(x.last)}</td>
      <td class="num gpa">${fmtGpa(x.gpa)}</td>
      <td class="num">${fmtPct(x.pA)}</td>
      <td class="num sm-hide">${x.graded.toLocaleString()}</td>
      <td class="l sm-hide">${distBar(x)}</td></tr>`;
  }).join("");
  return `<thead><tr>${th}</tr></thead><tbody>${body || `<tr><td colspan="6" class="empty">No sections match these filters.</td></tr>`}</tbody>`;
}

const LABELS = {p:"professor", last:"last taught", gpa:"GPA", pA:"how many got an A", graded:"students"};
function sortNote() { const el = document.getElementById("psort"); if (!el) return; const {key, dir} = st.profSort; const lab = LABELS[key] || key;
  el.textContent = `Sorted by ${lab}, ${key === "p" ? (dir > 0 ? "A to Z" : "Z to A") : key === "last" ? (dir < 0 ? "newest first" : "oldest first") : (dir < 0 ? "highest first" : "lowest first")}. Tap any column to sort by it.`; }
function sortBy(s, k, firstDir) { if (s.key === k) s.dir = -s.dir; else { s.key = k; s.dir = firstDir; } }

const SCOLS = [["T","Semester","l"],["P","Professor","l"],["sec","Section","l sm-hide"],["n","Students","sm-hide"],["A","A","sm-hide"],["B","B","sm-hide"],["C","C","sm-hide"],["D","D","sm-hide"],["F","F","sm-hide"],["Q","Q","sm-hide"],["gpa","GPA"],["pA","Got an A"]];
function renderSections(rows) {
  const q = st.secFilter.trim().toLowerCase();
  let list = rows.map(r => { const n = r[R.A]+r[R.B]+r[R.C]+r[R.D]+r[R.F]; return { r, T: r[R.T], P: PROFS[r[R.P]], sec: r[R.sec], n, A:r[R.A],B:r[R.B],C:r[R.C],D:r[R.D],F:r[R.F],Q:r[R.Q], gpa: n ? (4*r[R.A]+3*r[R.B]+2*r[R.C]+r[R.D])/n : null, pA: pct(r[R.A], n) }; });
  if (q) list = list.filter(x => (x.P + " " + nice(x.P) + " " + semLabel(x.T) + " " + x.sec).toLowerCase().includes(q));
  const {key, dir} = st.secSort;
  list.sort((x,y) => { let a = x[key], b = y[key]; if (typeof a === "string") return dir * a.localeCompare(b) || (y.T - x.T); if (a==null) a=-1; if (b==null) b=-1; return dir*(a-b) || (y.T - x.T) || x.sec.localeCompare(y.sec); });
  const shown = list.slice(0, st.secLimit);

  const b = document.getElementById("secall"); if (b) b.onclick = () => { st.secLimit = Infinity; renderSections(rows); };
}

function drawChart(rows, colorOf) {

// Syllabus policies pulled from syllabi the user supplies. Key: professor as listed in grade reports.
const SYLLABI = window.SYLLABI || {};
const HOWDY = "https://howdy.tamu.edu/main/home/class-search-ui";
const coursicle = p => "https://www.google.com/search?q=" + encodeURIComponent("site:coursicle.com/tamu/professors " + p.split(" ")[0]);
const rmp = p => "https://www.ratemyprofessors.com/search/professors/1003?q=" + encodeURIComponent(p.split(" ")[0]);
// ---------- syllabus: paste text, pull out the policies, keep them on this device ----------
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} } };
const TOPICS = {
  attendance: /\b(attendance|absen(ce|ces|t)|excused|unexcused|student rule 7|tard(y|iness)|roll call|sign[- ]in)\b/gi,
  late: /\b(late (work|assignment|submission|penalt)|late\b|make-?up|extensions?|deadline|past due|penalt(y|ies)|no credit)\b/gi,
  grading: /\b(exam|midterm|final|quiz(zes)?|homework|assignments?|participation|project|paper|presentation|lab)s?\b/gi,
};
function extractPolicies(text) {
  const paras = text.replace(/\r/g, "").split(/\n\s*\n|\n(?=[A-Z][A-Za-z /&-]{2,40}:?\s*\n)/).map(t => { const ls = t.trim().split(/\n/); if (ls.length > 1 && ls[0].trim().split(/\s+/).length <= 4 && !/[.!?]$/.test(ls[0].trim())) ls.shift(); return ls.join(" ").replace(/\s+/g, " ").trim(); }).filter(t => t.length > 25);
  const score = (t, re) => (t.match(re) || []).length;
  const scored = paras.map(t => ({ t, a: score(t, TOPICS.attendance), l: score(t, TOPICS.late) }));
  const clip = t => t.length > 600 ? t.slice(0, 600) + "…" : t;
  // each paragraph goes to the topic it talks about most
  const pick = (key, other, n) => scored.filter(x => x[key] > 0 && x[key] >= x[other]).sort((a,b) => b[key] - a[key]).slice(0, n).map(x => clip(x.t));
  const lines = text.split(/\n/).map(t => t.replace(/\s+/g, " ").trim()).filter(t => /\d{1,3}\s?%/.test(t) && new RegExp(TOPICS.grading.source, "i").test(t) && t.length < 140);
  return { attendance: pick("a", "l", 2), late: pick("l", "a", 2), grading: [...new Set(lines)].slice(0, 8), at: Date.now() };
}
function policyHtml(p) {
  const s = store.get("agf-syl-" + p, null);

  const reviews = `<a href="${rmp(p)}" target="_blank" rel="noopener">Rate My Professors</a> or <a href="${coursicle(p)}" target="_blank" rel="noopener">Coursicle</a> for ${esc(nice(p).split(" ")[0])}. Check the department and first name match.`;
  if (!s) return `<section class="policy" aria-label="Before you enroll">
    <div class="pcard missing"><span class="k">Attendance and late work</span><p>Open a past syllabus in <a href="${HOWDY}" target="_blank" rel="noopener">Howdy Class Search</a> (A&amp;M login), copy all the text, and paste it here.</p>
      <button class="btn" id="sylopen" type="button">Paste a syllabus</button>
      <div id="sylbox" hidden><textarea id="syltext" rows="6" placeholder="Paste the whole syllabus here"></textarea><div class="row"><button class="btn primary" id="sylgo" type="button">Pull out the policies</button><span class="src">Saved on this device only.</span></div></div>
    </div>
    <div class="pcard missing"><span class="k">Student reviews</span><p>${reviews}</p></div>
  </section>`;
  return `<section class="policy" aria-label="Before you enroll">
    <div class="pcard"><span class="k">Attendance</span>${body(s.attendance, "The syllabus doesn't mention attendance.")}</div>
    <div class="pcard"><span class="k">Late work</span>${body(s.late, "The syllabus doesn't mention late work.")}</div>
    <div class="pcard"><span class="k">Grade breakdown</span>${s.grading.length ? `<ul>${s.grading.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : `<p class="muted">No percentages found.</p>`}</div>
    <div class="pcard"><span class="k">Student reviews</span><p>${reviews}</p></div>
  </section>
  <p class="sortnote">From the syllabus you pasted. Saved on this device only. <button class="link" id="sylclear" type="button">Remove it</button></p>`;
}
function bindPolicy(p) {
  const o = document.getElementById("sylopen"), go = document.getElementById("sylgo"), clr = document.getElementById("sylclear");
  if (o) o.onclick = () => { document.getElementById("sylbox").hidden = false; o.hidden = true; document.getElementById("syltext").focus(); };
  if (go) go.onclick = () => { const t = document.getElementById("syltext").value; if (t.trim().length < 50) return; store.set("agf-syl-" + p, extractPolicies(t)); render(); };
  if (clr) clr.onclick = () => { try { localStorage.removeItem("agf-syl-" + p); } catch(e) {} render(); };
}
function renderProf(p) {
  const courses = [...profCourses.get(p)].sort();
  const allRows = courses.flatMap(c => D.courses[c].filter(r => PROFS[r[R.P]] === p).map(r => ({c, r})));
  fixRange(semsOf(allRows.map(x => x.r)));
  const rows = allRows.filter(x => inRange(x.r));
  const a = agg(rows.map(x => x.r));
  const app = document.getElementById("app");
  const perCourse = courses.map(c => {
    const rs = rows.filter(x => x.c === c).map(x => x.r);
    const mine = agg(rs);
    const everyone = agg(D.courses[c].filter(inRange));
    return { c, mine, everyone };
  }).filter(x => x.mine.sections);
  app.innerHTML = `
    <div class="head">
      <div><h1>${esc(nice(p))}</h1><div class="meta">Listed in grade reports as <span class="num">${esc(p)}</span> · ${courses.length} loaded course${courses.length>1?"s":""}</div></div>

    <section class="panel">

        <thead><tr><th class="l">Course</th><th>Their GPA</th><th>vs. course</th><th>Got an A</th><th>Students</th></tr></thead>
        <tbody>${perCourse.map(x => { const d = x.mine.gpa - x.everyone.gpa; return `<tr>

          <td class="num">${fmtPct(x.mine.pA)}</td><td class="num">${x.mine.graded}</td></tr>`; }).join("") || `<tr><td colspan="5" class="empty">No sections in this range.</td></tr>`}</tbody>
      </table></div>
    </section>
    <details class="panel">
      <summary><h2>Every section</h2></summary>
      <div class="tscroll"><table>
        <thead><tr><th class="l">Semester</th><th class="l">Course</th><th class="l sm-hide">Section</th><th>Students</th><th class="sm-hide">A</th><th class="sm-hide">B</th><th class="sm-hide">C</th><th class="sm-hide">D</th><th class="sm-hide">F</th><th class="sm-hide">Q</th><th>GPA</th></tr></thead>
        <tbody>${rows.sort((x,y)=>y.r[R.T]-x.r[R.T]||x.c.localeCompare(y.c)).map(({c,r}) => { const n=r[R.A]+r[R.B]+r[R.C]+r[R.D]+r[R.F]; return `<tr>
          <td class="l num"><span class="lg-only">${semLabel(r[R.T])}</span><span class="sm-only">${semShort(r[R.T])}</span></td><td class="l"><button class="link" data-course="${c}">${c}</button></td><td class="l num sm-hide">${esc(r[R.sec])}${isHonors(r)?`<span class="tag">H</span>`:""}</td>
          <td class="num">${n}</td><td class="num sm-hide">${r[R.A]}</td><td class="num sm-hide">${r[R.B]}</td><td class="num sm-hide">${r[R.C]}</td><td class="num sm-hide">${r[R.D]}</td><td class="num sm-hide">${r[R.F]}</td><td class="num sm-hide">${r[R.Q]}</td>
          <td class="num gpa">${fmtGpa(n?(4*r[R.A]+3*r[R.B]+2*r[R.C]+r[R.D])/n:null)}</td></tr>`; }).join("")}</tbody>
      </table></div>
    </details>
    <p class="foot">Grade reports only show a last name and first initial, so two different people with the same initial (for example two R. Johnsons) appear as one professor here.</p>`;
  bindFilters(app);

  remember("prof", p);
  if (chart) { chart.destroy(); chart = null; }

// global link handling
document.addEventListener("click", e => {
  const pb = e.target.closest("[data-prof]"); if (pb && !e.target.matches("input")) { go("prof", pb.dataset.prof); return; }
  const cb = e.target.closest("button[data-course]"); if (cb) go("course", cb.dataset.course);

// ---------- search ----------
const qi = document.getElementById("q"), sg = document.getElementById("suggest");
let hits = [], sel = 0;
function courseSub(c) {
  if (IDX && IDX.courses[c]) { const [n,t] = IDX.courses[c]; const d = IDX.depts[c.slice(0,4)]; return `${d ? d + " · " : ""}${n ? n.toLocaleString() + " students past year" : "last offered " + semShort(t)}`; }
  return D.courses[c] ? D.courses[c].length + " sections" : "";
}
function search(q) {
  q = q.trim().toUpperCase().replace(/\s+/g," ");
  if (!q) return [];
  const qc = q.replace(/^([A-Z]{4})\s*(\d)/, "$1 $2");
  const qn = q.replace(/ /g,"");
  const out = [];
  const all = new Set(COURSES); if (IDX) for (const c in IDX.courses) all.add(c);
  const size = c => (IDX && IDX.courses[c]) ? IDX.courses[c][0] : 0;
  let cs = [...all].filter(c => c.startsWith(qc) || c.replace(" ","").startsWith(qn));
  // department-name matches, e.g. "chem" or "chemistry" -> CHEM courses
  let deptCodes = [];
  if (IDX && q.length >= 3 && !/\d/.test(q)) {
    deptCodes = Object.entries(IDX.depts).filter(([code, name]) => code.startsWith(q) || name.toUpperCase().split(/[^A-Z]+/).some(w => w.length > 2 && (w.startsWith(q) || q.startsWith(w)))).map(([code]) => code).sort((a,b) => (b.startsWith(q) - a.startsWith(q)));
    for (const code of deptCodes) for (const c of all) if (c.startsWith(code + " ")) cs.push(c);
  }
  cs = [...new Set(cs)];
  if (/^[A-Z]{3,4}$/.test(q) || deptCodes.length) cs.sort((a,b) => size(b) - size(a)); else cs.sort();
  for (const code of deptCodes.slice(0, 2)) out.push({type:"dept", key:code, sub: IDX.depts[code]});
  for (const c of cs.slice(0, deptCodes.length ? 5 : 7)) out.push({type: D.courses[c] ? "course" : "fetch", key:c, sub: courseSub(c)});
  // name: "Johnson, Richard George" -> "JOHNSON R"
  let nameQ = q;
  const m = q.match(/^([A-Z'\- ]+),\s*([A-Z])/); if (m) nameQ = m[1].trim() + " " + m[2];
  const words = nameQ.replace(/,/g," ").split(" ").filter(Boolean);
  const pk = new Set(profCourses.keys()); if (IDX) for (const p in IDX.profs) pk.add(p);
  if (q.length >= 2 && !/\d/.test(q)) for (const p of pk) {
    const last = p.split(" ")[0];
    if (p.startsWith(nameQ) || (words.length && last.startsWith(words[0]) && words.slice(1).every(w => p.includes(" " + w[0])))) {
      const cl = new Set([...(profCourses.get(p) || []), ...((IDX && IDX.profs[p]) || [])]);
      out.push({type:"prof", key:p, sub: [...cl].slice(0,3).join(", ") + (cl.size > 3 ? "…" : "")});
    }
    if (out.length > 30) break;
  }
  if (COURSE_RE.test(qc) && !all.has(qc)) out.unshift({type:"fetch", key:qc, sub:"Look up all semesters"});
  return out.slice(0, 9);
}
function showSuggest() {
  hits = search(qi.value); sel = 0;
  if (!qi.value.trim()) { sg.hidden = true; return; }
  sg.innerHTML = hits.length ? hits.map((h,i) => `<button role="option" aria-selected="${i===sel}" data-i="${i}"><span class="kind">${h.type==="prof"?"Professor":h.type==="dept"?"Dept":"Course"}</span><span>${h.type==="prof"?esc(nice(h.key)):h.type==="dept"?"All "+h.key+" courses":h.key}</span><span class="sub">${esc(h.sub)}</span></button>`).join("")
    : `<div class="empty" style="padding:14px">${/^[A-Za-z]{4}\s*\d{0,2}$/.test(qi.value.trim()) ? `Keep typing the 3-digit course number, like ${esc(qi.value.trim().slice(0,4).toUpperCase())} 363.` : `Nothing matches “${esc(qi.value)}”. Type a course like SCMT 364, or a professor's last name.`}</div>`;
  sg.hidden = false;
}
function pick(i) { const h = hits[i]; if (!h) return; sg.hidden = true; qi.value = ""; qi.blur(); if (h.type === "dept") { location.hash = "dept-" + h.key; return; } go(h.type === "prof" ? "prof" : "course", h.key); }
qi.addEventListener("input", showSuggest);
qi.addEventListener("focus", showSuggest);
qi.addEventListener("keydown", e => {
  if (sg.hidden) return;
  if (e.key === "ArrowDown") { sel = Math.min(sel+1, hits.length-1); e.preventDefault(); }
  else if (e.key === "ArrowUp") { sel = Math.max(sel-1, 0); e.preventDefault(); }
  else if (e.key === "Enter") { pick(sel); e.preventDefault(); return; }
  else if (e.key === "Escape") { sg.hidden = true; return; }
  else return;
  sg.querySelectorAll("[role=option]").forEach((b,i) => b.setAttribute("aria-selected", i===sel));
});
sg.addEventListener("mousedown", e => { const b = e.target.closest("[data-i]"); if (b) { e.preventDefault(); pick(+b.dataset.i); } });
qi.addEventListener("blur", () => setTimeout(() => sg.hidden = true, 120));
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== qi && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); qi.focus(); } });
